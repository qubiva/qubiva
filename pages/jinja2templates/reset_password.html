<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="cache-control" content="max-age=0" />
  <meta http-equiv="cache-control" content="no-cache" />
  <meta http-equiv="expires" content="0" />
  <meta http-equiv="expires" content="Tue, 01 Jan 1980 1:00:00 GMT" />
  <meta http-equiv="pragma" content="no-cache" />
  <title>Qubiva | Reset Password</title>
  <!-- Favicons -->
  <link rel="icon" type="image/x-icon" href="{{ static_content_url }}/static/custom/favicons/favicon.ico">
  <link rel="icon" type="image/png" sizes="16x16" href="{{ static_content_url }}/static/custom/favicons/favicon-16x16.png">
  <link rel="icon" type="image/png" sizes="32x32" href="{{ static_content_url }}/static/custom/favicons/favicon-32x32.png">
  <link rel="apple-touch-icon" href="{{ static_content_url }}/static/custom/favicons/apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="{{ static_content_url }}/static/custom/favicons/android-chrome-192x192.png">
  <link rel="icon" type="image/png" sizes="512x512" href="{{ static_content_url }}/static/custom/favicons/android-chrome-512x512.png">
  <link rel="icon" type="image/x-icon" href="{{ static_content_url }}/static/custom/images/favicon.ico">

  <!-- Google Font: Source Sans Pro -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css?family=Source+Sans+Pro:300,400,400i,700&display=fallback">
  <!-- Font Awesome -->
  <link rel="stylesheet" href="{{ static_content_url }}/static/plugins/fontawesome-free/css/all.min.css">
  <!-- icheck bootstrap -->
  <link rel="stylesheet" href="{{ static_content_url }}/static/plugins/icheck-bootstrap/icheck-bootstrap.min.css">
  <!-- Theme style -->
  <link rel="stylesheet" href="{{ static_content_url }}/static/dist/css/adminlte.min.css">

  <!-- Custom CSS for Shake Animation -->
  <style>
    .shake {
      animation: shake 0.5s ease;
    }

    @keyframes shake {
      0%, 100% { transform: translateX(0); }
      10%, 30%, 50%, 70%, 90% { transform: translateX(-5px); }
      20%, 40%, 60%, 80% { transform: translateX(5px); }
    }
  </style>
</head>
<body class="hold-transition login-page">
<div class="login-box">
  <div class="card card-outline card-primary">
    <div class="card-header text-center">
      <a href="" class="h1"><b>Qubiva</b></a>
    </div>
    <div class="card-body">
      <p class="login-box-msg"><b>Enter a New Password</b></p>

      <form id="resetPasswordForm" autocomplete="off">
        <div class="input-group mb-3">
          <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="New Password" required>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>
        <div class="input-group mb-3">
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="Confirm New Password" required>
          <div class="input-group-append">
            <div class="input-group-text">
              <span class="fas fa-lock"></span>
            </div>
          </div>
        </div>
        <div class="row">
          <div class="col-12">
            <button type="submit" id="submitButton" class="btn btn-primary btn-block">Reset Password</button>
          </div>
        </div>
        <div id="messageArea" class="mt-3 text-center"></div>
      </form>

      <br><a href="/login" style="float: right;"><i class="fas fa-arrow-left"></i> <b>Back to Login</b></a>
    </div>
  </div>
</div>

<!-- jQuery -->
<script src="{{ static_content_url }}/static/plugins/jquery/jquery.min.js"></script>
<!-- Bootstrap 4 -->
<script src="{{ static_content_url }}/static/plugins/bootstrap/js/bootstrap.bundle.min.js"></script>
<!-- AdminLTE App -->
<script src="{{ static_content_url }}/static/dist/js/adminlte.min.js"></script>

<script>
  $(document).ready(function () {
    // Extract token from URL
    const urlParams = new URLSearchParams(window.location.search);
    const token = urlParams.get('token');

    if (!token) {
      $('#messageArea').html('<span class="text-danger">Invalid access. Password reset token is missing.</span>');
      $('#resetPasswordForm').hide();
      window.location.href = "/login";
      return;
    }

    $('#resetPasswordForm').on('submit', function (event) {
      event.preventDefault();

      const newPassword = $('#newPassword').val();
      const confirmPassword = $('#confirmPassword').val();
      const submitButton = $('#submitButton');

      if (newPassword !== confirmPassword) {
        displayMessage('Passwords do not match.', 'text-danger', true);
        return;
      }

      // Disable button after it's clicked
      submitButton.prop('disabled', true);

      $.ajax({
        url: '/api/v1/password/submit-new-password',
        type: 'POST',
        contentType: 'application/json',
        data: JSON.stringify({ token: token, new_password: newPassword }),
        success: function (response) {
          displayMessage('Password reset successful. Redirecting...', 'text-success', false);
          // Disable the form to prevent further submissions
          $('#resetPasswordForm input, #resetPasswordForm button').prop('disabled', true);
          // Force redirect after a brief delay
          setTimeout(function() {
            window.location.replace('/login');
          }, 1500);
        },
        error: function (xhr) {
          const errorMessage = xhr.responseJSON?.detail || 'Error resetting password';
          displayMessage(errorMessage, 'text-danger', true);
          submitButton.prop('disabled', false);
        }
      });
    });

    // Function to display message with optional shake animation for errors only
    function displayMessage(message, cssClass, shouldShake) {
    const messageArea = $('#messageArea');
    
    // If the same message is being set, reapply the shake class
    const isSameMessage = messageArea.text() === message;
    
    messageArea.removeClass('text-success text-danger shake');

    // Set the message, apply the color class
    messageArea.html(`<span class="${cssClass}">${message}</span>`);

    // Re-trigger shake animation for repeated messages or errors
    if (shouldShake || isSameMessage) {
      setTimeout(function () {
        messageArea.addClass('shake');
      }, 10);
    }
  }

  });
</script>
</body>
</html>
