name: CI

on:
  push:
    branches: [main, "feature/**"]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install linting tools
        run: pip install flake8

      - name: Run flake8
        run: |
          flake8 app/ \
            --max-line-length=120 \
            --extend-ignore=E501,W503,E115,E116,E117,E125,E128,E129,E131,E402 \
            --exclude=__pycache__

  test:
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-asyncio httpx

      - name: Start MongoDB replica set
        run: |
          docker run -d --name mongo -p 27017:27017 mongo:7 mongod --replSet rs0
          for i in $(seq 1 10); do
            docker exec mongo mongosh --quiet --eval "db.adminCommand({ping:1})" && break
            sleep 2
          done
          docker exec mongo mongosh --quiet --eval "rs.initiate({_id:'rs0',members:[{_id:0,host:'localhost:27017'}]})"
          sleep 3

      - name: Run tests
        env:
          DATABASE_URL: "mongodb://localhost:27017/qubiva_test?replicaSet=rs0&directConnection=true"
          LOCAL_ENCRYPTION_KEY: "KgDHcP43XCCdrqeLhNXkoUhMN91T8SoK3Du9IRuCp4M="
          LOCAL_SIGNING_KEY: "ci-test-signing-key"
          JWT_SECRET: "ci-test-jwt-secret"
          INTERNAL_API_KEY: "ci-test-internal-api-key"
          K8S_NAMESPACE: "default"
          ARTIFACTS_STORAGE_PATH: "/tmp/artifacts"
          LOG_LEVEL: "WARNING"
        run: |
          mkdir -p /tmp/artifacts
          pytest tests/ -v --tb=short

  docker-build:
    runs-on: ubuntu-latest
    needs: test
    strategy:
      matrix:
        include:
          - name: app
            context: .
            file: ./Dockerfile
          - name: iac-runner
            context: ./iac_runner
            file: ./iac_runner/Dockerfile
          - name: discovery-runner
            context: ./discovery_runner
            file: ./discovery_runner/Dockerfile
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build ${{ matrix.name }} image (no push)
        uses: docker/build-push-action@v5
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          push: false
          tags: qubiva/${{ matrix.name }}:ci-${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,mode=max,scope=${{ matrix.name }}

  helm-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4

      - name: Lint Helm chart
        run: helm lint helm/qubiva/
