name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'docs/deck/**'
      - 'docs/screenshots/**'
      - 'screenshots/**'
      - '.github/workflows/pages.yaml'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Marp CLI
        run: npm install -g @marp-team/marp-cli

      - name: Build slides
        run: |
          mkdir -p build
          marp docs/deck/slides.md \
            --theme docs/deck/theme.css \
            --html \
            --output build/index.html

      - name: Build screenshots gallery
        run: |
          mkdir -p build/screenshots/img
          cp screenshots/*.png build/screenshots/img/
          cp docs/screenshots/index.html build/screenshots/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
