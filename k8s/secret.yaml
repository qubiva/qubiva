apiVersion: v1
kind: Secret
metadata:
  name: qubiva-secrets
  namespace: qubiva
  labels:
    app: qubiva
type: Opaque
stringData:
  # MongoDB connection string with replica set (required for change streams)
  DATABASE_URL: "mongodb://mongo:27017/qubiva?replicaSet=rs0"

  # Fernet encryption key (generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())")
  LOCAL_ENCRYPTION_KEY: ""

  # RSA signing key seed (any random string, used to deterministically generate RSA key pair)
  LOCAL_SIGNING_KEY: ""

  # SMTP credentials for email service
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_USERNAME: ""
  SMTP_PASSWORD: ""
  SMTP_FROM_EMAIL: ""

  # GitHub token (if needed for template repos)
  GITHUB_TOKEN: ""

  # JWT secret (used for session tokens)
  JWT_SECRET: ""

  # Internal API key for runner job callbacks (generate with: python -c "import secrets; print(secrets.token_urlsafe(32))")
  INTERNAL_API_KEY: ""

  # LLM API key for Cloud Analyst (OpenAI, Anthropic, Groq, etc.)
  LLM_API_KEY: ""
