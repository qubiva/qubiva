# Loki - Log aggregation for runner job logs
# Stores logs with configurable per-job-type retention
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: qubiva
  labels:
    app: qubiva
    component: loki
data:
  loki.yaml: |
    auth_enabled: false

    server:
      http_listen_port: 3100
      grpc_listen_port: 9096

    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory

    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h

    limits_config:
      # Default retention for runner/app logs
      retention_period: 30d
      # Per-stream retention overrides
      retention_stream:
        - selector: '{log_type="audit"}'
          priority: 1
          period: 365d
      max_query_length: 2232h
      max_query_series: 5000
      ingestion_burst_size_mb: 16
      ingestion_rate_mb: 8

    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem

    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100

---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: loki-data
  namespace: qubiva
  labels:
    app: qubiva
    component: loki
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 10Gi

---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: loki
  namespace: qubiva
  labels:
    app: qubiva
    component: loki
spec:
  serviceName: loki
  replicas: 1
  selector:
    matchLabels:
      app: qubiva
      component: loki
  template:
    metadata:
      labels:
        app: qubiva
        component: loki
    spec:
      containers:
        - name: loki
          image: grafana/loki:3.3.2
          ports:
            - containerPort: 3100
              name: http
          args:
            - -config.file=/etc/loki/loki.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            requests:
              memory: 256Mi
              cpu: 100m
            limits:
              memory: 1Gi
              cpu: 500m
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: loki-config
        - name: data
          persistentVolumeClaim:
            claimName: loki-data

---
apiVersion: v1
kind: Service
metadata:
  name: loki
  namespace: qubiva
  labels:
    app: qubiva
    component: loki
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: http
      name: http
  selector:
    app: qubiva
    component: loki
