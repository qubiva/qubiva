apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: qubiva

resources:
  - namespace.yaml
  - serviceaccount.yaml
  - rbac.yaml
  - configmap.yaml
  - secret.yaml
  - pvc.yaml
  - loki.yaml
  - mongodb.yaml
  - deployment.yaml
  - service.yaml
  - ingress.yaml

commonLabels:
  managed-by: qubiva
