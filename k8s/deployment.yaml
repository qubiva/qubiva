apiVersion: apps/v1
kind: Deployment
metadata:
  name: qubiva
  namespace: qubiva
  labels:
    app: qubiva
spec:
  replicas: 1
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app: qubiva
      managed-by: qubiva
  template:
    metadata:
      labels:
        app: qubiva
        managed-by: qubiva
    spec:
      serviceAccountName: qubiva-app
      terminationGracePeriodSeconds: 60
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: qubiva
          image: qubiva/app:v77
          imagePullPolicy: Never
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: qubiva-env
            - secretRef:
                name: qubiva-secrets
          volumeMounts:
            - name: app-config
              mountPath: /app/config
              readOnly: true
            - name: artifacts-storage
              mountPath: /app/data/artifacts
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          readinessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /api/health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            failureThreshold: 12
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
      volumes:
        - name: app-config
          configMap:
            name: qubiva-config
        - name: artifacts-storage
          persistentVolumeClaim:
            claimName: qubiva-artifacts
