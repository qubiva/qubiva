# MongoDB with replica set enabled (required for change streams)
# For production, use a MongoDB operator (e.g., Percona, MongoDB Community Operator)
# or a managed MongoDB service.
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mongodb
  namespace: qubiva
  labels:
    app: mongodb
spec:
  serviceName: mongo
  replicas: 1
  selector:
    matchLabels:
      app: mongodb
  template:
    metadata:
      labels:
        app: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: mongo:7
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
              name: mongodb
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      RESULT=$(mongosh --quiet --eval "
                        try {
                          var s = rs.status();
                          if (s.ok === 1) { print('READY'); quit(0); }
                        } catch(e) {
                          try {
                            rs.initiate({_id:'rs0',members:[{_id:0,host:'qubiva-mongo:27017'}]});
                            print('INITIATED');
                            quit(0);
                          } catch(e2) { print('RETRY: ' + e2.message); }
                        }
                      " 2>/dev/null) || true
                      case "$RESULT" in
                        READY|INITIATED) exit 0 ;;
                      esac
                      sleep 2
                    done
                    echo "MongoDB RS init failed after 60s" >&2
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          env:
            - name: MONGO_INITDB_DATABASE
              value: qubiva
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "2Gi"
          readinessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command:
                - mongosh
                - --eval
                - "db.adminCommand('ping')"
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
        labels:
          app: mongodb
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: 10Gi

---
apiVersion: v1
kind: Service
metadata:
  name: mongo
  namespace: qubiva
  labels:
    app: mongodb
spec:
  type: ClusterIP
  selector:
    app: mongodb
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb

