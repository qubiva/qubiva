{{- if not .Values.existingSecret }}
{{- $secretName := include "qubiva.secretName" . }}
{{- $existingSecret := lookup "v1" "Secret" .Release.Namespace $secretName }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $secretName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $dbUrl := .Values.secrets.databaseUrl }}
  {{- if and (not $dbUrl) .Values.mongodb.enabled }}
  {{- $dbUrl = printf "mongodb://%s-mongo:27017/qubiva?replicaSet=rs0" (include "qubiva.fullname" .) }}
  {{- end }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required when mongodb.enabled=false (e.g. mongodb://mongo:27017/qubiva?replicaSet=rs0)" $dbUrl | quote }}
  {{- if .Values.secrets.localEncryptionKey }}
  LOCAL_ENCRYPTION_KEY: {{ .Values.secrets.localEncryptionKey | quote }}
  {{- else if and $existingSecret (index $existingSecret.data "LOCAL_ENCRYPTION_KEY") }}
  LOCAL_ENCRYPTION_KEY: {{ index $existingSecret.data "LOCAL_ENCRYPTION_KEY" | b64dec | quote }}
  {{- else }}
  LOCAL_ENCRYPTION_KEY: {{ randBytes 32 | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.localSigningKey }}
  LOCAL_SIGNING_KEY: {{ .Values.secrets.localSigningKey | quote }}
  {{- else if and $existingSecret (index $existingSecret.data "LOCAL_SIGNING_KEY") }}
  LOCAL_SIGNING_KEY: {{ index $existingSecret.data "LOCAL_SIGNING_KEY" | b64dec | quote }}
  {{- else }}
  LOCAL_SIGNING_KEY: {{ randAlphaNum 43 | quote }}
  {{- end }}
  {{- if .Values.secrets.jwtSecret }}
  JWT_SECRET: {{ .Values.secrets.jwtSecret | quote }}
  {{- else if and $existingSecret (index $existingSecret.data "JWT_SECRET") }}
  JWT_SECRET: {{ index $existingSecret.data "JWT_SECRET" | b64dec | quote }}
  {{- else }}
  JWT_SECRET: {{ randAlphaNum 43 | quote }}
  {{- end }}
  {{- if .Values.secrets.internalApiKey }}
  INTERNAL_API_KEY: {{ .Values.secrets.internalApiKey | quote }}
  {{- else if and $existingSecret (index $existingSecret.data "INTERNAL_API_KEY") }}
  INTERNAL_API_KEY: {{ index $existingSecret.data "INTERNAL_API_KEY" | b64dec | quote }}
  {{- else }}
  INTERNAL_API_KEY: {{ randAlphaNum 43 | quote }}
  {{- end }}
  {{- with .Values.secrets.llmApiKey }}
  LLM_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpHost }}
  SMTP_HOST: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPort }}
  SMTP_PORT: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpUsername }}
  SMTP_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpFromEmail }}
  SMTP_FROM_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubToken }}
  GITHUB_TOKEN: {{ . | quote }}
  {{- end }}
  {{- if .Values.aiGateway.enabled }}
  {{- if .Values.secrets.aiGatewayMasterKey }}
  AI_GATEWAY_MASTER_KEY: {{ .Values.secrets.aiGatewayMasterKey | quote }}
  {{- else if and $existingSecret (index $existingSecret.data "AI_GATEWAY_MASTER_KEY") }}
  AI_GATEWAY_MASTER_KEY: {{ index $existingSecret.data "AI_GATEWAY_MASTER_KEY" | b64dec | quote }}
  {{- else }}
  AI_GATEWAY_MASTER_KEY: {{ randAlphaNum 43 | quote }}
  {{- end }}
  AI_GATEWAY_DB_USERNAME: {{ .Values.secrets.aiGatewayDbUsername | default "litellm" | quote }}
  {{- if .Values.secrets.aiGatewayDbPassword }}
  AI_GATEWAY_DB_PASSWORD: {{ .Values.secrets.aiGatewayDbPassword | quote }}
  {{- else if and $existingSecret (index $existingSecret.data "AI_GATEWAY_DB_PASSWORD") }}
  AI_GATEWAY_DB_PASSWORD: {{ index $existingSecret.data "AI_GATEWAY_DB_PASSWORD" | b64dec | quote }}
  {{- else }}
  AI_GATEWAY_DB_PASSWORD: {{ randAlphaNum 24 | quote }}
  {{- end }}
  {{- end }}
{{- end }}
