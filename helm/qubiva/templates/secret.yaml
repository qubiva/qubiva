{{- if not .Values.existingSecret }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "qubiva.secretName" . }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- $dbUrl := .Values.secrets.databaseUrl }}
  {{- if and (not $dbUrl) .Values.mongodb.enabled }}
  {{- $dbUrl = printf "mongodb://%s-mongo:27017/qubiva?replicaSet=rs0" (include "qubiva.fullname" .) }}
  {{- end }}
  DATABASE_URL: {{ required "secrets.databaseUrl is required when mongodb.enabled=false (e.g. mongodb://mongo:27017/qubiva?replicaSet=rs0)" $dbUrl | quote }}
  LOCAL_ENCRYPTION_KEY: {{ required "secrets.localEncryptionKey is required (generate with: python -c \"from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())\")" .Values.secrets.localEncryptionKey | quote }}
  LOCAL_SIGNING_KEY: {{ required "secrets.localSigningKey is required (any random string)" .Values.secrets.localSigningKey | quote }}
  JWT_SECRET: {{ required "secrets.jwtSecret is required (generate with: python -c \"import secrets; print(secrets.token_urlsafe(32))\")" .Values.secrets.jwtSecret | quote }}
  INTERNAL_API_KEY: {{ required "secrets.internalApiKey is required (generate with: python -c \"import secrets; print(secrets.token_urlsafe(32))\")" .Values.secrets.internalApiKey | quote }}
  {{- with .Values.secrets.llmApiKey }}
  LLM_API_KEY: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpHost }}
  SMTP_HOST: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPort }}
  SMTP_PORT: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpUsername }}
  SMTP_USERNAME: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpPassword }}
  SMTP_PASSWORD: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.smtpFromEmail }}
  SMTP_FROM_EMAIL: {{ . | quote }}
  {{- end }}
  {{- with .Values.secrets.githubToken }}
  GITHUB_TOKEN: {{ . | quote }}
  {{- end }}
{{- end }}
