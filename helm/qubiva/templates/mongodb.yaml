{{- if .Values.mongodb.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "qubiva.fullname" . }}-mongodb
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
    component: mongodb
spec:
  serviceName: {{ include "qubiva.fullname" . }}-mongo
  replicas: 1
  selector:
    matchLabels:
      {{- include "qubiva.selectorLabels" . | nindent 6 }}
      component: mongodb
  template:
    metadata:
      labels:
        {{- include "qubiva.selectorLabels" . | nindent 8 }}
        component: mongodb
    spec:
      terminationGracePeriodSeconds: 30
      containers:
        - name: mongodb
          image: {{ .Values.mongodb.image }}
          args: ["--replSet", "rs0", "--bind_ip_all"]
          ports:
            - containerPort: 27017
              name: mongodb
          lifecycle:
            postStart:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - |
                    for i in $(seq 1 30); do
                      if mongosh --quiet --eval "db.adminCommand('ping')" >/dev/null 2>&1; then
                        mongosh --quiet --eval "
                          try { rs.status(); print('RS already initialized'); }
                          catch(e) { rs.initiate({_id:'rs0',members:[{_id:0,host:'{{ include "qubiva.fullname" . }}-mongo:27017'}]}); print('RS initialized'); }
                        "
                        exit 0
                      fi
                      sleep 2
                    done
                    echo "MongoDB not ready after 60s" >&2
          volumeMounts:
            - name: mongo-data
              mountPath: /data/db
          env:
            - name: MONGO_INITDB_DATABASE
              value: qubiva
          resources:
            {{- toYaml .Values.mongodb.resources | nindent 12 }}
          readinessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            exec:
              command: ["mongosh", "--eval", "db.adminCommand('ping')"]
            initialDelaySeconds: 30
            periodSeconds: 30
            timeoutSeconds: 5
  volumeClaimTemplates:
    - metadata:
        name: mongo-data
        labels:
          {{- include "qubiva.selectorLabels" . | nindent 10 }}
          component: mongodb
      spec:
        accessModes:
          - ReadWriteOnce
        resources:
          requests:
            storage: {{ .Values.mongodb.storageSize }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qubiva.fullname" . }}-mongo
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
    component: mongodb
spec:
  type: ClusterIP
  selector:
    {{- include "qubiva.selectorLabels" . | nindent 4 }}
    component: mongodb
  ports:
    - port: 27017
      targetPort: 27017
      name: mongodb
{{- end }}
