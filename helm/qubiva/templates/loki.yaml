apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qubiva.fullname" . }}-loki-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
    component: loki
data:
  loki.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
      grpc_listen_port: 9096
    common:
      path_prefix: /loki
      storage:
        filesystem:
          chunks_directory: /loki/chunks
          rules_directory: /loki/rules
      replication_factor: 1
      ring:
        instance_addr: 127.0.0.1
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: 2024-01-01
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    limits_config:
      retention_period: 30d
      retention_stream:
        - selector: '{log_type="audit"}'
          priority: 1
          period: 365d
      max_query_length: 2232h
      max_query_series: 5000
      ingestion_burst_size_mb: 16
      ingestion_rate_mb: 8
    compactor:
      working_directory: /loki/compactor
      compaction_interval: 10m
      retention_enabled: true
      retention_delete_delay: 2h
      retention_delete_worker_count: 150
      delete_request_store: filesystem
    query_range:
      results_cache:
        cache:
          embedded_cache:
            enabled: true
            max_size_mb: 100
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ include "qubiva.fullname" . }}-loki-data
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
    component: loki
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: {{ .Values.loki.storageSize }}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "qubiva.fullname" . }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
    component: loki
spec:
  serviceName: {{ include "qubiva.fullname" . }}-loki
  replicas: 1
  selector:
    matchLabels:
      {{- include "qubiva.selectorLabels" . | nindent 6 }}
      component: loki
  template:
    metadata:
      labels:
        {{- include "qubiva.selectorLabels" . | nindent 8 }}
        component: loki
    spec:
      containers:
        - name: loki
          image: {{ .Values.loki.image }}
          ports:
            - containerPort: 3100
              name: http
          args:
            - -config.file=/etc/loki/loki.yaml
          volumeMounts:
            - name: config
              mountPath: /etc/loki
            - name: data
              mountPath: /loki
          resources:
            {{- toYaml .Values.loki.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /ready
              port: http
            initialDelaySeconds: 30
            periodSeconds: 15
      volumes:
        - name: config
          configMap:
            name: {{ include "qubiva.fullname" . }}-loki-config
        - name: data
          persistentVolumeClaim:
            claimName: {{ include "qubiva.fullname" . }}-loki-data
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "qubiva.fullname" . }}-loki
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
    component: loki
spec:
  type: ClusterIP
  ports:
    - port: 3100
      targetPort: http
      name: http
  selector:
    {{- include "qubiva.selectorLabels" . | nindent 4 }}
    component: loki
