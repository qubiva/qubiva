apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qubiva.fullname" . }}-config
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
data:
  app_config.json: |
    {
      "system": {
        "environment": "production",
        "log_level": {{ .Values.env.LOG_LEVEL | quote }}
      },
      "app": {
        "base_url": "http://{{ include "qubiva.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local"
      },
      "terraform": {
        "engine": {{ .Values.iacEngine | quote }}
      },
      {{- if .Values.cloudAnalyst.llm.provider }}
      "cloud_analyst": {
        "llm": {
          "provider": {{ .Values.cloudAnalyst.llm.provider | quote }},
          "model": {{ .Values.cloudAnalyst.llm.model | quote }},
          "base_url": {{ .Values.cloudAnalyst.llm.baseUrl | quote }},
          "api_key_env": {{ .Values.cloudAnalyst.llm.apiKeyEnv | quote }}
        },
        "session": {
          "pool_size": 1,
          "idle_timeout_seconds": 900,
          "query_timeout_seconds": 120,
          "max_result_rows": 500
        }
      },
      {{- end }}
      {{- if .Values.aiGateway.enabled }}
      "ai_governance": {
        "enabled": true,
        "gateway": {
          "url": {{ if .Values.aiGateway.ingress.enabled }}{{ printf "https://%s" .Values.aiGateway.ingress.host | quote }}{{ else }}{{ printf "http://%s-ai-gateway.%s.svc.cluster.local:%d" (include "qubiva.fullname" .) .Release.Namespace (.Values.aiGateway.service.port | int) | quote }}{{ end }}
        },
        "providers": {{ .Values.aiGateway.providers | toJson }}
      },
      {{- end }}
      "runner_pools": {
        "iac": {
          "enabled": {{ .Values.runnerPools.iac.enabled }},
          "pool_size": {{ .Values.runnerPools.iac.poolSize }},
          "pod_timeout_seconds": {{ .Values.runnerPools.iac.podTimeoutSeconds }},
          "execution_mode": {{ .Values.runnerPools.iac.executionMode | quote }}
        },
        "discovery": {
          "enabled": {{ .Values.runnerPools.discovery.enabled }},
          "pool_size": {{ .Values.runnerPools.discovery.poolSize }},
          "pod_timeout_seconds": {{ .Values.runnerPools.discovery.podTimeoutSeconds }},
          "stale_threshold_seconds": {{ .Values.runnerPools.discovery.staleThresholdSeconds }},
          "execution_mode": {{ .Values.runnerPools.discovery.executionMode | quote }}
        },
        "quotas": {
          "max_concurrent_per_project": {{ .Values.runnerPools.quotas.maxConcurrentPerProject }}
        }
      }
    }
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qubiva.fullname" . }}-env
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
data:
  K8S_NAMESPACE: {{ .Release.Namespace | quote }}
  APP_CONFIG_PATH: "/app/config/app_config.json"
  ARTIFACTS_STORAGE_PATH: "/app/data/artifacts"
  ARTIFACTS_PREFIX: "runs"
  IAC_RUNNER_IMAGE: {{ include "qubiva.iacRunnerImage" . | quote }}
  DISCOVERY_RUNNER_IMAGE: {{ include "qubiva.discoveryRunnerImage" . | quote }}
  RUNNER_SERVICE_ACCOUNT: {{ .Values.runnerServiceAccount.name | quote }}
  LOG_LEVEL: {{ .Values.env.LOG_LEVEL | quote }}
  QUBIVA_API_ENDPOINT: "http://{{ include "qubiva.fullname" . }}.{{ .Release.Namespace }}.svc.cluster.local"
  INTERNAL_CIDR: {{ .Values.env.INTERNAL_CIDR | quote }}
  TF_BACKEND_TYPE: {{ .Values.env.TF_BACKEND_TYPE | quote }}
  MASTER_ADMIN_USER: {{ .Values.env.MASTER_ADMIN_USER | quote }}
  JOB_TTL_SECONDS_AFTER_FINISHED: {{ .Values.env.JOB_TTL_SECONDS_AFTER_FINISHED | quote }}
  LOKI_URL: "http://{{ include "qubiva.fullname" . }}-loki.{{ .Release.Namespace }}.svc.cluster.local:3100"
  RELEASE_VERSION: {{ .Values.image.tag | quote }}
  LOG_RETENTION_DAYS_TERRAFORM: {{ .Values.env.LOG_RETENTION_DAYS_TERRAFORM | quote }}
  LOG_RETENTION_DAYS_DISCOVERY: {{ .Values.env.LOG_RETENTION_DAYS_DISCOVERY | quote }}
{{- if .Values.aiGateway.enabled }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "qubiva.fullname" . }}-ai-gateway-auth
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "qubiva.labels" . | nindent 4 }}
data:
  litellm_config.yaml: |
    general_settings:
      master_key: "os.environ/LITELLM_MASTER_KEY"
      store_model_in_db: true
      custom_auth: custom_auth.custom_auth
  custom_auth.py: |
    """
    LiteLLM custom auth hook — Qubiva identity validation.

    Every request to the AI gateway must carry:
      Authorization: Bearer <virtual-key>   (standard LiteLLM virtual key)
      X-Qubiva-Token: <qubiva-jwt>          (Qubiva user or project JWT)

    The hook calls Qubiva's internal validate-token endpoint, which enforces
    key-binding rules (project scope, user scope, RBAC permissions).
    """
    import os

    import httpx
    from fastapi import HTTPException, Request, status
    from litellm.proxy._types import UserAPIKeyAuth, LitellmUserRoles

    _QUBIVA_URL = os.environ.get("QUBIVA_URL", "http://qubiva").rstrip("/")
    _VALIDATE_URL = f"{_QUBIVA_URL}/api/v1/internal/validate-token"
    _INTERNAL_API_KEY = os.environ.get("INTERNAL_API_KEY", "")
    _MASTER_KEY = os.environ.get("LITELLM_MASTER_KEY", "")
    _TIMEOUT = 10


    async def custom_auth(request: Request, api_key: str) -> UserAPIKeyAuth:
        """Validate a Qubiva identity token against the presented LiteLLM virtual key.

        Master key requests (Qubiva backend management calls) bypass Qubiva identity
        validation — the master key never leaves the cluster and is already protected
        by network isolation. All virtual key requests require X-Qubiva-Token.
        """
        if _MASTER_KEY and api_key == _MASTER_KEY:
            return UserAPIKeyAuth(
                api_key=api_key,
                user_id="qubiva-backend",
                user_role=LitellmUserRoles.PROXY_ADMIN,
            )

        qubiva_token = request.headers.get("x-qubiva-token", "").strip()
        if not qubiva_token:
            raise HTTPException(
                status_code=status.HTTP_401_UNAUTHORIZED,
                detail=(
                    "Missing X-Qubiva-Token header. "
                    "Pass your Qubiva identity token alongside the virtual key."
                ),
            )

        headers = {}
        if _INTERNAL_API_KEY:
            headers["X-Internal-Api-Key"] = _INTERNAL_API_KEY

        try:
            async with httpx.AsyncClient(timeout=_TIMEOUT) as client:
                resp = await client.post(
                    _VALIDATE_URL,
                    json={"token": qubiva_token, "virtual_key": api_key},
                    headers=headers,
                )
        except httpx.RequestError as exc:
            raise HTTPException(
                status_code=status.HTTP_503_SERVICE_UNAVAILABLE,
                detail=f"Qubiva auth service unreachable: {exc}",
            )

        if resp.status_code == 200:
            data = resp.json()
            return UserAPIKeyAuth(
                api_key=api_key,
                user_id=data.get("username") or data.get("project_name"),
                team_id=data.get("project_name"),
            )

        try:
            detail = resp.json().get("detail", resp.text)
        except Exception:
            detail = resp.text
        raise HTTPException(status_code=resp.status_code, detail=detail)
{{- end }}
