# Qubiva Helm Chart — Default Values
# Override any of these in your own values file or via --set flags.

# -- Container image configuration
image:
  repository: ghcr.io/qubiva/qubiva
  tag: ""  # Defaults to Chart.appVersion
  pullPolicy: IfNotPresent

imagePullSecrets: []

# -- Number of Qubiva app replicas
replicaCount: 1

# -- Service account for the Qubiva app pod
serviceAccount:
  name: qubiva-app

# -- Service account for runner jobs (Terraform, discovery, compliance)
runnerServiceAccount:
  name: qubiva-runner

# -- Kubernetes Service
service:
  type: ClusterIP
  port: 80

# -- Ingress configuration
ingress:
  enabled: false
  className: nginx
  host: qubiva.local
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "600"
    nginx.ingress.kubernetes.io/proxy-http-version: "1.1"
    nginx.ingress.kubernetes.io/configuration-snippet: |
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
  tls: []

# -- Qubiva app resource limits
resources:
  requests:
    cpu: 250m
    memory: 512Mi
  limits:
    cpu: 1000m
    memory: 1Gi

# -- Artifacts PVC (stores run outputs)
artifacts:
  storageSize: 10Gi
  # For multi-node clusters, change to ReadWriteMany (requires NFS/EFS/Azure Files CSI)
  accessMode: ReadWriteOnce
  storageClassName: ""

# -- Runner images (IaC and discovery/compliance runners)
runners:
  iac:
    image: ghcr.io/qubiva/qubiva-iac-runner
    tag: ""  # Defaults to Chart.appVersion
  discovery:
    image: ghcr.io/qubiva/qubiva-discovery-runner
    tag: ""  # Defaults to Chart.appVersion

# -- IaC engine: "tofu" (default, OpenTofu) or "terraform"
iacEngine: tofu

# -- Runner pool configuration
runnerPools:
  iac:
    enabled: true
    poolSize: 1
    podTimeoutSeconds: 1800
    executionMode: pool_with_fallback
  discovery:
    enabled: true
    poolSize: 2
    podTimeoutSeconds: 1800
    staleThresholdSeconds: 900
    executionMode: pool_with_fallback
  quotas:
    maxConcurrentPerProject: 0

# -- Cloud Analyst (AI chat) LLM configuration
# Set provider + model + baseUrl + llmApiKey to enable AI-powered cloud analysis.
# Any OpenAI-compatible API endpoint is supported (OpenAI, Groq, Azure OpenAI, etc.)
cloudAnalyst:
  llm:
    provider: ""
    model: ""
    baseUrl: ""
    apiKeyEnv: LLM_API_KEY

# -- Application environment variables (non-sensitive)
env:
  LOG_LEVEL: INFO
  INTERNAL_CIDR: "10.0.0.0/8"
  TF_BACKEND_TYPE: kubernetes
  MASTER_ADMIN_USER: admin@qubiva.local
  JOB_TTL_SECONDS_AFTER_FINISHED: "3600"
  LOG_RETENTION_DAYS_TERRAFORM: "90"
  LOG_RETENTION_DAYS_DISCOVERY: "30"

# -- Secrets (sensitive values — override these!)
secrets:
  # MongoDB connection string (replica set required for change streams)
  databaseUrl: ""
  # Generate with: python -c "from cryptography.fernet import Fernet; print(Fernet.generate_key().decode())"
  localEncryptionKey: ""
  # Any random string — used to derive RSA key pair
  localSigningKey: ""
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  jwtSecret: ""
  # Generate with: python -c "import secrets; print(secrets.token_urlsafe(32))"
  internalApiKey: ""
  # LLM provider API key (OpenAI, Groq, Anthropic, etc.)
  llmApiKey: ""
  # SMTP (optional)
  smtpHost: ""
  smtpPort: "587"
  smtpUsername: ""
  smtpPassword: ""
  smtpFromEmail: ""
  # GitHub token (optional, for template repos)
  githubToken: ""
  # AI Gateway master key — auto-generated on first install if empty.
  # The generated key is stored in the Kubernetes Secret and persists across upgrades
  # because the secret.yaml template reads the existing value before regenerating.
  # To rotate: set a new value here and run:
  #   helm upgrade <release> . --set secrets.aiGatewayMasterKey=<new-key> --reuse-values
  # All Qubiva management calls use this key internally (never exposed to end users).
  # End-user access is controlled via LiteLLM virtual keys, not the master key.
  aiGatewayMasterKey: ""
  # AI Gateway PostgreSQL credentials (used when aiGateway.postgresql.enabled)
  aiGatewayDbUsername: "litellm"
  aiGatewayDbPassword: ""

# -- Use an existing secret instead of creating one from values above
existingSecret: ""

# -- MongoDB (bundled single-node replica set for development)
mongodb:
  enabled: true
  image: mongo:7
  storageSize: 10Gi
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

# -- AI Governance Gateway (LiteLLM proxy — optional, disabled by default)
# Enable to activate the AI governance control plane.
# Requires aiGateway.postgresql.enabled or an external PostgreSQL instance.
aiGateway:
  enabled: false
  image: ghcr.io/berriai/litellm:main-stable
  replicaCount: 1
  service:
    port: 4000
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi
  ingress:
    enabled: false
    className: nginx
    host: ""
    annotations: {}
    tls: []
  # -- LLM provider definitions exposed to the Add Model UI.
  # Each entry drives the provider dropdown and its dynamic form fields.
  # litellmProvider overrides the value sent as custom_llm_provider to LiteLLM
  # (defaults to id when omitted). Fields with credential: true are offered
  # via the stored-credential picker in addition to direct entry.
  providers:
    - id: openai
      label: OpenAI
      fields:
        - id: api_key
          label: API Key
          type: password
          required: true
          credential: true
    - id: anthropic
      label: Anthropic
      fields:
        - id: api_key
          label: API Key
          type: password
          required: true
          credential: true
    - id: groq
      label: Groq
      fields:
        - id: api_key
          label: API Key
          type: password
          required: true
          credential: true
    - id: azure
      label: Azure OpenAI
      fields:
        - id: api_base
          label: Endpoint URL
          type: text
          placeholder: "https://myorg.openai.azure.com"
          required: true
        - id: api_version
          label: API Version
          type: text
          placeholder: "2024-02-01"
          required: true
        - id: api_key
          label: API Key
          type: password
          required: true
          credential: true
    - id: bedrock
      label: Amazon Bedrock
      fields:
        - id: aws_region_name
          label: AWS Region
          type: text
          placeholder: "us-east-1"
          required: true
        - id: aws_access_key_id
          label: Access Key ID
          type: text
          required: false
        - id: aws_secret_access_key
          label: Secret Access Key
          type: password
          required: false
          credential: true
    - id: vertex_ai
      label: Google Vertex AI
      fields:
        - id: vertex_project
          label: GCP Project ID
          type: text
          required: true
        - id: vertex_location
          label: Region
          type: text
          placeholder: "us-central1"
          required: true
        - id: vertex_credentials
          label: Service Account JSON
          type: password
          required: false
          credential: true
    - id: openai-compatible
      label: OpenAI-Compatible (Self-hosted)
      litellmProvider: openai
      fields:
        - id: api_base
          label: Endpoint URL
          type: text
          placeholder: "http://10.0.0.1:8000/v1"
          required: true
        - id: api_key
          label: API Key
          type: password
          required: false
          credential: true
    - id: ollama
      label: Ollama
      fields:
        - id: api_base
          label: Endpoint URL
          type: text
          placeholder: "http://localhost:11434"
          required: true
  # -- Bundled PostgreSQL for LiteLLM state (spend, virtual keys, budgets)
  postgresql:
    enabled: true
    image: postgres:16
    storageSize: 10Gi
    database: litellm
    resources:
      requests:
        cpu: 250m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 1Gi
  # -- Bring your own PostgreSQL (set postgresql.enabled: false and fill these)
  externalPostgresql:
    host: ""
    port: 5432
    database: litellm
    secretName: ""   # must contain keys: username, password

# -- Loki log aggregation (required for log persistence and audit trail)
loki:
  image: grafana/loki:3.3.2
  storageSize: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 1Gi
